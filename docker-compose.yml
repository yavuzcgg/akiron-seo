services:
  postgres:
    image: postgres:16-alpine
    container_name: akironseo_postgres
    restart: always
    environment:
      POSTGRES_USER: akiron_user
      POSTGRES_PASSWORD: akiron_password
      POSTGRES_DB: akironseo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akiron_user -d akironseo_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
